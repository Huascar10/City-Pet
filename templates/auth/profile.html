{% extends 'base.html' %}
{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 fw-bold mb-0">Mi Perfil</h1>
        <p class="text-muted small">Administración de credenciales e información personal</p>
      </div>
    </div>

    <div class="card citypet-card border-0 mb-4">
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <h5 class="fw-semibold mb-3 text-primary"><i class="bi bi-person-lines-fill me-2"></i>Información Personal</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Nombre Completo</label>
              <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Correo Electrónico</label>
              <input type="email" name="email" class="form-control" value="{{ current_user.email or '' }}" placeholder="usuario@correo.com">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Nombre de Usuario</label>
              <input type="text" class="form-control bg-light" value="{{ current_user.username }}" disabled>
              <small class="text-muted">El nombre de usuario no es modificable.</small>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Rol Asignado</label>
              <input type="text" class="form-control bg-light text-capitalize" value="{{ current_user.role }}" disabled>
            </div>
          </div>

          <hr class="my-4">

          <h5 class="fw-semibold mb-3 text-primary"><i class="bi bi-shield-lock me-2"></i>Cambiar Contraseña</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Contraseña Actual</label>
              <input type="password" name="current_password" class="form-control" placeholder="••••••••">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Nueva Contraseña</label>
              <input type="password" name="new_password" class="form-control" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Confirmar Nueva Contraseña</label>
              <input type="password" name="confirm_password" class="form-control" placeholder="••••••••">
            </div>
          </div>

          <div class="mt-4 text-end">
            <button type="submit" class="btn btn-citypet-primary px-4">
              <i class="bi bi-save me-1"></i> Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
